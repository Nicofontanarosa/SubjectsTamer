# Scopo: verifica il 404 per un battleId inesistente.
# Come: invia un'azione abandon valida verso un ID non creato e controlla battle_not_found.
# Collegato: indipendente; GM 18-19 coprono battaglie esistenti e finalizzate.
info:
  name: GM 11 - POST /battles/{battleId}/actions - scenario 1 - 404 missing battle
  type: http
  seq: 11

http:
  method: POST
  url: "{{gameManagerUrl}}/battles/no-such-battle/actions"
  body:
    type: json
    data: |-
      {
        "actionType": "abandon",
        "playerId": "missing-battle-player"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: battle_not_found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
