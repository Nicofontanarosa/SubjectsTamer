# Scopo: prepara una battaglia per il retry della cronologia di un abbandono.
# Come: crea una battaglia per history-abandon-retry e salva il battleId.
# Collegato: variante 1 dello scenario 6; GM 33 fallisce il primo salvataggio e GM 34 ritenta.
info:
  name: GM 32 - POST /battles - scenario 6 - 201 abandon history setup
  type: http
  seq: 32

http:
  method: POST
  url: "{{gameManagerUrl}}/battles"
  body:
    type: json
    data: |-
      {
        "playerId": "history-abandon-retry"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("gmAbandonRetryBattleId", res.body.battleId);
    - type: tests
      code: |-
        test("creates the abandon history retry battle", function () {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("in_progress");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
