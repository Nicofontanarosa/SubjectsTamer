# Scopo: crea una battaglia attiva da usare nella prova di cancellazione.
# Come: avvia una battaglia per delete-player e conserva il battleId.
# Collegato: scenario 1; GM 36 cancella la battaglia e GM 37 verifica una nuova creazione.
info:
  name: GM 35 - POST /battles - scenario 1 - 201 delete setup created
  type: http
  seq: 35

http:
  method: POST
  url: "{{gameManagerUrl}}/battles"
  body:
    type: json
    data: |-
      {
        "playerId": "delete-player"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("gmDeleteBattleId", res.body.battleId);
    - type: tests
      code: |-
        test("creates the battle used by deletion scenarios", function () {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("in_progress");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
