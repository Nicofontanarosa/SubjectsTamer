info:
  name: "[Collector - public - Test 1.1] /monster - invalid playerId (query param) and body"
  type: http
  seq: 3

http:
  method: GET
  url: "{{collectorUrl}}/monsters?playerId={{test-player-Id-err}}"
  params:
    - name: playerId
      value: "{{test-player-Id-err}}"
      type: query
  body:
    type: json
    data: |-
      {
        "battleId": "battle-test-12"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: Invalid playerId
    - expression: res.body.monsters
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
