info:
  name: "[Collector - public - Test 1.2] /monster - missing playerId"
  type: http
  seq: 4

http:
  method: GET
  url: "{{collectorUrl}}/monsters"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: Invalid playerId
    - expression: res.body.monsters
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
