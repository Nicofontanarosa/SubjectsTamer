info:
  name: "[Collector - public - Test 1] /monster - success"
  type: http
  seq: 2

http:
  method: GET
  url: "{{collectorUrl}}/monsters?playerId={{test-player-Id}}"
  params:
    - name: playerId
      value: "{{test-player-Id}}"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: Catalog

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
