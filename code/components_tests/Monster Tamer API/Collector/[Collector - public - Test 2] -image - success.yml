info:
  name: "[Collector - public - Test 2] /image - success"
  type: http
  seq: 5

http:
  method: GET
  url: "{{collectorUrl}}/monsters/{{monster_id}}/image"
  auth: inherit

runtime:
  assertions:
    - expression: res.headers['content-type']
      operator: eq
      value: image/jpeg

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
