info:
  name: "[Collector - public - Test 3.1] /collection - invalid playerId"
  type: http
  seq: 8

http:
  method: GET
  url: "{{collectorUrl}}/players/{{test-player-Id-err}}/collection"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: OK
    - expression: res.body.monsters
      operator: length
      value: "0"
      description: empty body

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
