info:
  name: "[Collector - public - Test 3] /collection - valid playerId"
  type: http
  seq: 7

http:
  method: GET
  url: "{{collectorUrl}}/players/{{test-player-Id}}/collection"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: OK
    - expression: res.body.monsters
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
