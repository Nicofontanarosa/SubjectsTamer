info:
  name: "[Collector - public - Test 4.1] /team - invalid body"
  type: http
  seq: 11

http:
  method: PUT
  url: "{{collectorUrl}}/players/{{test-player-Id}}/team"
  body:
    type: json
    data: '{ "monsIds": ["algorithms", "mathematical-analysis", "chimiche-della-vita"] }'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
      description: Invalid body
    - expression: res.body.error
      operator: eq
      value: invalid_team

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
