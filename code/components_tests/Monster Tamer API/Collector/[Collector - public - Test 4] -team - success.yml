info:
  name: "[Collector - public - Test 4] /team - success"
  type: http
  seq: 10

http:
  method: PUT
  url: "{{collectorUrl}}/players/{{test-player-Id}}/team"
  body:
    type: json
    data: '{ "monsterIds": ["programming-algorithms", "mathematical-analysis", "chimiche-della-vita"] }'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: Team updated

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
