info:
  name: "[Collectore - internal - Test 2.1] /monsters - error monsterId"
  type: http
  seq: 18

http:
  method: POST
  url: "{{collectorUrl}}/internal/players/{{test-player-Id}}/collection/monsters"
  body:
    type: json
    data: |-
      {
        "monsterId": "{{monster_id_err}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
      description: Missing card
    - expression: res.body.error
      operator: eq
      value: unknown_card

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
