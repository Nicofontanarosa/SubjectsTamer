info:
  name: "[Collectore - internal - Test 2.2] /monsters - error body"
  type: http
  seq: 19

http:
  method: POST
  url: "{{collectorUrl}}/internal/players/{{test-player-Id}}/collection/monsters"
  body:
    type: json
    data: |-
      {
        "monstertest": "{{monster_id}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
      description: Wrong body
    - expression: res.body.error
      operator: eq
      value: unknown_card

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
