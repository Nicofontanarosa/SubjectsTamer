info:
  name: "[Collectore - internal - Test 2.3] /monsters - invalid playerId"
  type: http
  seq: 20

http:
  method: POST
  url: "{{collectorUrl}}/internal/players/{{test-player-Id-err}}/collection/monsters"
  body:
    type: json
    data: |-
      {
        "monsterId": "{{monster_id}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
      description: Invalid playerId
    - expression: res.body.error
      operator: eq
      value: invalid_player

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
