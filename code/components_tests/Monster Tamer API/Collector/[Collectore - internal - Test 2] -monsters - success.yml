info:
  name: "[Collectore - internal - Test 2] /monsters - success"
  type: http
  seq: 17

http:
  method: POST
  url: "{{collectorUrl}}/internal/players/{{test-player-Id}}/collection/monsters"
  body:
    type: json
    data: |-
      {
        "monsterId": "{{monster_id}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: Card added

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
