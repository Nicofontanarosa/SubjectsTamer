info:
  name: "[Collectore - internal - Test 3] /team - success"
  type: http
  seq: 20

http:
  method: GET
  url: "{{collectorUrl}}/internal/players/{{test-player-Id}}/team"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: OK
    - expression: res.body.team
      operator: length
      value: "3"
      description: Valid team

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
