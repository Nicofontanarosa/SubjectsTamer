info:
  name: "[Encounter - Test 11] Reject encounter with negative turns count"
  type: http
  seq: 11

http:
  method: POST
  url: "{{encounterUrl}}/internal/encounters"
  body:
    type: json
    data: |-
      {
        "battleId": "battle-test-11",
        "playerId": "player-123",
        "bossId": "computer-science-foundations",
        "teamUsed": ["linear-algebra", "computer-science-lab-ii", "operations-research"],
        "result": "win",
        "outcome": "Victory by knockout",
        "turns": -1,
        "timestamp": "2026-11-17T12:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: invalid_turns
    - expression: res.body.message
      operator: eq
      value: Turn count must be a non-negative integer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
