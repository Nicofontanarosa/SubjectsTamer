info:
  name: "[Encounter - Test 13] Reject encounter with invalid timestamp"
  type: http
  seq: 13

http:
  method: POST
  url: "{{encounterUrl}}/internal/encounters"
  body:
    type: json
    data: |-
      {
        "battleId": "battle-test-12",
        "playerId": "{{test-player-Id}}",
        "bossId": "computer-science-foundations",
        "teamUsed": ["linear-algebra", "computer-science-lab-ii", "operations-research"],
        "result": "win",
        "outcome": "Victory by knockout",
        "turns": 5,
        "timestamp": "not-a-timestamp"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: invalid_timestamp
    - expression: res.body.message
      operator: eq
      value: Valid start and completion timestamps are required

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
