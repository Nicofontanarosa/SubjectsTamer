info:
  name: "[Encounter - Test 14] List player encounters ordered by completion date"
  type: http
  seq: 14

http:
  method: GET
  url: "{{encounterUrl}}/players/{{test-player-Id}}/encounters"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.pagination.limit
      operator: eq
      value: "20"
    - expression: res.body.pagination.offset
      operator: eq
      value: "0"
    - expression: res.body.encounters[0].battleId
      operator: eq
      value: seed-battle-02
    - expression: res.body.encounters[1].battleId
      operator: eq
      value: seed-battle-01

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
