info:
  name: "[Encounter - Test 15] Reject invalid pagination - limit below minimum"
  type: http
  seq: 15

http:
  method: GET
  url: "{{encounterUrl}}/players/{{test-player-Id}}/encounters?limit=0"
  params:
    - name: limit
      value: "0"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: invalid_pagination
    - expression: res.body.message
      operator: eq
      value: Limit must be 1-100 and offset cannot be negative

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
