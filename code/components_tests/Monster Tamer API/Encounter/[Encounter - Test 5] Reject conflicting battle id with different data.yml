info:
  name: "[Encounter - Test 5] Reject conflicting battle id with different data"
  type: http
  seq: 5

http:
  method: POST
  url: "{{encounterUrl}}/internal/encounters"
  body:
    type: json
    data: |-
      {
        "battleId": "seed-battle-02",
        "playerId": "{{test-player-Id}}",
        "bossId": "computer-science-foundations",
        "teamUsed": ["linear-algebra", "computer-science-lab-ii", "operations-research"],
        "result": "loss",
        "outcome": "loss",
        "turns": 9,
        "startedAt": "2026-11-17T13:00:00Z",
        "timestamp": "2026-11-17T13:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.error
      operator: eq
      value: battle_id_conflict
    - expression: res.body.message
      operator: eq
      value: This battle ID belongs to another result

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
