info:
  name: "[Encounter - Test 9] Reject encounter with duplicate cards in team"
  type: http
  seq: 9

http:
  method: POST
  url: "{{encounterUrl}}/internal/encounters"
  body:
    type: json
    data: |-
      {
        "battleId": "battle-test-09",
        "playerId": "player-123",
        "bossId": "computer-science-foundations",
        "teamUsed": ["linear-algebra", "linear-algebra", "operations-research"],
        "result": "win",
        "outcome": "Victory by knockout",
        "turns": 5,
        "timestamp": "2026-11-17T12:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: invalid_team
    - expression: res.body.message
      operator: eq
      value: History requires three distinct catalog cards

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
