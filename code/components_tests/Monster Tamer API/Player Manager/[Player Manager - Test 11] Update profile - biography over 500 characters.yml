info:
  name: '[Player Manager - Test 11] Update profile - biography over 500 characters'
  type: http
  seq: 11
http:
  method: PUT
  url: '{{playerManagerUrl}}/players/{{test-player-Id}}'
  body:
    type: json
    data: "{\n  \"nickname\": \"UpdatedPlayer\",\n  \"avatar\": \"mage\",\n  \"bio\": \"\"\
      \n}"
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '400'
  - expression: res.body.error
    operator: eq
    value: invalid_profile
  - expression: res.body.message
    operator: eq
    value: Profile details are invalid
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
