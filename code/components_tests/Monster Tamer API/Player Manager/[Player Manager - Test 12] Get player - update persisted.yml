info:
  name: '[Player Manager - Test 12] Get player - update persisted'
  type: http
  seq: 12
http:
  method: GET
  url: '{{playerManagerUrl}}/players/{{test-player-Id}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.player.playerId
    operator: eq
    value: '{{test-player-Id}}'
  - expression: res.body.player.email
    operator: eq
    value: '{{player-test-email}}'
  - expression: res.body.player.nickname
    operator: eq
    value: UpdatedPlayer
  - expression: res.body.player.avatar
    operator: eq
    value: mage
  - expression: res.body.player.bio
    operator: eq
    value: Profile changed by Bruno
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
