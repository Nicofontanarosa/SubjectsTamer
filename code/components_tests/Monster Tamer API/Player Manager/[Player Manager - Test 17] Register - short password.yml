info:
  name: '[Player Manager - Test 17] Register - short password'
  type: http
  seq: 17
  
http:
  method: POST
  url: '{{playerManagerUrl}}/players'
  body:
    type: json
    data: "{\n  \"email\": \"weak@example.com\",\n  \"password\": \"short\",\n  \"nickname\": \"WeakPasswordPlayer\"\n}"
  auth: inherit

runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '400'
  - expression: res.body.error
    operator: eq
    value: weak_password
  - expression: res.body.message
    operator: eq
    value: Password must contain at least 10 characters

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
