info:
  name: '[Player Manager - Test 1] Health - success'
  type: http
  seq: 1
http:
  method: GET
  url: '{{playerManagerUrl}}/health'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.status
    operator: eq
    value: ok
  - expression: res.body.service
    operator: eq
    value: player-manager
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
