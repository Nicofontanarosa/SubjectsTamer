info:
  name: '[Player Manager - Test 20] Register - duplicate nickname'
  type: http
  seq: 20
http:
  method: POST
  url: '{{playerManagerUrl}}/players'
  body:
    type: json
    data: "{\n  \"email\": \"other.unique@example.com\",\n  \"password\": \"{{player-test-password}}\",\n  \"nickname\": \"ExistingPlayer\"\n}"
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '409'
  - expression: res.body.error
    operator: eq
    value: account_exists
  - expression: res.body.message
    operator: eq
    value: Email or nickname is already in use
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
