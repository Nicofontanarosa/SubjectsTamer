info:
  name: '[Player Manager - Test 2] Get player - seeded profile'
  type: http
  seq: 2
http:
  method: GET
  url: '{{playerManagerUrl}}/players/{{test-player-Id}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.player.playerId
    operator: eq
    value: '{{test-player-Id}}'
  - expression: res.body.player.email
    operator: eq
    value: '{{player-test-email}}'
  - expression: res.body.player.nickname
    operator: eq
    value: TestPlayer
  - expression: res.body.player.avatar
    operator: eq
    value: ranger
  - expression: res.body.player.bio
    operator: eq
    value: Initial profile
  - expression: res.body.player.createdAt
    operator: eq
    value: '2026-11-17T12:00:00+00:00'
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
