info:
  name: '[Player Manager - Test 30] Stub - failed initialization was attempted'
  type: http
  seq: 30
http:
  method: GET
  url: '{{playerStubUrl}}/__calls'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.count
    operator: eq
    value: '1'
  - expression: res.body.initializeCount
    operator: eq
    value: '1'
  - expression: res.body.calls[0].method
    operator: eq
    value: POST
  - expression: res.body.calls[0].status
    operator: eq
    value: '503'
  - expression: res.body.calls[0].path
    operator: contains
    value: /collection/initialize
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
