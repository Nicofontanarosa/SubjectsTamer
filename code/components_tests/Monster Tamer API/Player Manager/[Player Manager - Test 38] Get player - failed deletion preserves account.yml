info:
  name: '[Player Manager - Test 38] Get player - failed deletion preserves account'
  type: http
  seq: 38
http:
  method: GET
  url: '{{playerManagerUrl}}/players/{{player-failed-delete-id}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.player.playerId
    operator: eq
    value: '{{player-failed-delete-id}}'
  - expression: res.body.player.nickname
    operator: eq
    value: FailDeletePlayer
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
