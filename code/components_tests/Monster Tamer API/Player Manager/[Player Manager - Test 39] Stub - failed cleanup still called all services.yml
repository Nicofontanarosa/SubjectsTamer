info:
  name: '[Player Manager - Test 39] Stub - failed cleanup still called all services'
  type: http
  seq: 39
http:
  method: GET
  url: '{{playerStubUrl}}/__calls'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.count
    operator: eq
    value: '3'
  - expression: res.body.collectorDeleteCount
    operator: eq
    value: '1'
  - expression: res.body.encounterDeleteCount
    operator: eq
    value: '1'
  - expression: res.body.gameManagerDeleteCount
    operator: eq
    value: '1'
  - expression: res.body.calls[0].path
    operator: eq
    value: /internal/players/{{player-failed-delete-id}}/collection
  - expression: res.body.calls[1].path
    operator: eq
    value: /internal/players/{{player-failed-delete-id}}/encounters
  - expression: res.body.calls[1].status
    operator: eq
    value: '503'
  - expression: res.body.calls[2].path
    operator: eq
    value: /internal/players/{{player-failed-delete-id}}/battles
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
