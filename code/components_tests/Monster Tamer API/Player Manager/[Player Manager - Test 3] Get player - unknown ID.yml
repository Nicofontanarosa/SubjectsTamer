info:
  name: '[Player Manager - Test 3] Get player - unknown ID'
  type: http
  seq: 3
http:
  method: GET
  url: '{{playerManagerUrl}}/players/{{test-player-Id-err}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '404'
  - expression: res.body.error
    operator: eq
    value: not_found
  - expression: res.body.message
    operator: eq
    value: Player not found
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
