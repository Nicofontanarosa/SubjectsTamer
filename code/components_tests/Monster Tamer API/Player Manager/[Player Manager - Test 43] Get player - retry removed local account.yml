info:
  name: '[Player Manager - Test 43] Get player - retry removed local account'
  type: http
  seq: 43
http:
  method: GET
  url: '{{playerManagerUrl}}/players/{{player-failed-delete-id}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '404'
  - expression: res.body.error
    operator: eq
    value: not_found
  - expression: res.body.message
    operator: eq
    value: Player not found
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
