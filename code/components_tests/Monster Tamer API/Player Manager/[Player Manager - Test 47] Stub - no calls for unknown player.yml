info:
  name: '[Player Manager - Test 47] Stub - no calls for unknown player'
  type: http
  seq: 47
http:
  method: GET
  url: '{{playerStubUrl}}/__calls'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.count
    operator: eq
    value: '0'
  - expression: res.body.calls.length
    operator: eq
    value: '0'
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
