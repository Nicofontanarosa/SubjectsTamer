info:
  name: '[Player Manager - Test 4] Login - correct credentials'
  type: http
  seq: 4
http:
  method: POST
  url: '{{playerManagerUrl}}/auth/login'
  body:
    type: json
    data: "{\n  \"email\": \"{{player-test-email}}\",\n  \"password\": \"{{player-test-password}}\"\n}"
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.body.player.playerId
    operator: eq
    value: '{{test-player-Id}}'
  - expression: res.body.player.email
    operator: eq
    value: '{{player-test-email}}'
  - expression: res.body.player.nickname
    operator: eq
    value: TestPlayer
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
