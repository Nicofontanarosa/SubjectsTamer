info:
  name: '[Player Manager - Test 5] Login - wrong password'
  type: http
  seq: 5
http:
  method: POST
  url: '{{playerManagerUrl}}/auth/login'
  body:
    type: json
    data: "{\n  \"email\": \"{{player-test-email}}\",\n  \"password\": \"incorrect-password\"\n}"
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '401'
  - expression: res.body.error
    operator: eq
    value: invalid_credentials
  - expression: res.body.message
    operator: eq
    value: Email or password is incorrect
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
