# Docker Compose file for the project, 5 services, 1 published port, 3 volumes, 1 network
name: grasp

services:
  gateway:
  # Instead of using build: ./gateway, specify the build context and Dockerfile separately.
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:5000:5005"
    environment:
      PLAYER_MANAGER_URL: http://player-manager:5005
      COLLECTOR_URL: http://collector:5005
      GAME_MANAGER_URL: http://game-manager:5005
      ENCOUNTER_URL: http://encounter:5005
      # Gateway configuration variable listing the frontend origins allowed to make browser requests.
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
    # service_healthy means the dependency must pass its health check.
      player-manager:
        condition: service_healthy
      collector:
        condition: service_healthy
      game-manager:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      # test: ["CMD", "python", "-c", ...] is a way to run an inline Python command.
      # This Docker Compose health check requests http://localhost:5005/health and waits up to 3 seconds.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  player-manager:
    build:
      context: .
      dockerfile: player_manager/Dockerfile
    environment:
      DATA_DIR: /data
      COLLECTOR_URL: http://collector:5005
      ENCOUNTER_URL: http://encounter:5005
      GAME_MANAGER_URL: http://game-manager:5005
    # Mount a volume for player data so it persists when the container is recreated.
    volumes:
      - player-data:/data
    depends_on:
      collector:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - collector-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  game-manager:
    build:
      context: .
      dockerfile: game_manager/Dockerfile
    environment:
      COLLECTOR_URL: http://collector:5005
      ENCOUNTER_URL: http://encounter:5005
      # If there are no moves for 30 minutes, the Game Manager considers the battle expired and clears its temporary in-memory state.
      BATTLE_TTL_MINUTES: 30
    depends_on:
      collector:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  encounter:
    build:
      context: .
      dockerfile: encounter/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - encounter-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

# Volumes are defined here so their data persists when containers are recreated.
volumes:
  player-data:
    name: code_player-data
  collector-data:
    name: code_collector-data
  encounter-data:
    name: code_encounter-data
