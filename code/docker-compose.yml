# Docker Compose file for the project, 5 services, 1 published port, 3 volumes, 1 network
name: grasp

services:
  gateway:
  # invece di fare build: ./gateway, facciamo build con context e dockerfile separati
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:5000:5005"
    environment:
      PLAYER_MANAGER_URL: http://player-manager:5005
      COLLECTOR_URL: http://collector:5005
      GAME_MANAGER_URL: http://game-manager:5005
      ENCOUNTER_URL: http://encounter:5005
      # variabile di configurazione del gateway. Indica quali indirizzi del frontend possono fare
      # richieste al gateway via browser
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
    # service_healthy sarebbe healthcheck
      player-manager:
        condition: service_healthy
      collector:
        condition: service_healthy
      game-manager:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      # test: ["CMD", "python", "-c", ...] è un modo per eseguire un comando python inline
      # È il controllo di salute di Docker Compose per il servizio, richiede http://localhost:5005/health e aspetta al massimo 3 secondi.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  player-manager:
    build:
      context: .
      dockerfile: player_manager/Dockerfile
    environment:
      DATA_DIR: /data
      COLLECTOR_URL: http://collector:5005
      ENCOUNTER_URL: http://encounter:5005
      GAME_MANAGER_URL: http://game-manager:5005
    # montiamo un volume per i dati dei giocatori, così che siano persistenti anche se il container viene ricreato
    volumes:
      - player-data:/data
    depends_on:
      collector:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - collector-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  game-manager:
    build:
      context: .
      dockerfile: game_manager/Dockerfile
    environment:
      COLLECTOR_URL: http://collector:5005
      ENCOUNTER_URL: http://encounter:5005
      # Se non ci sono mosse per 30 minuti, Game Manager la considera scaduta e libera lo stato temporaneo in memoria
      BATTLE_TTL_MINUTES: 30
    depends_on:
      collector:
        condition: service_healthy
      encounter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  encounter:
    build:
      context: .
      dockerfile: encounter/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - encounter-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5005/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

# i volumi sono definiti qui, così che siano persistenti anche se i container vengono ricreati
volumes:
  player-data:
    name: code_player-data
  collector-data:
    name: code_collector-data
  encounter-data:
    name: code_encounter-data
