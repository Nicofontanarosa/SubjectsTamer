openapi: 3.1.0
info:
  title: Collector API
  version: 1.0.0
  description: Collection ownership, team constraints, card catalog, and image delivery.
servers:
  - url: http://collector:5005
paths:
  /monsters:
    get:
      parameters:
        - name: playerId
          in: query
          schema: { type: string }
      summary: Return catalog cards with optional ownership state
      responses:
        "200": { description: Catalog cards with ownership flags when playerId is supplied }
        "500": { description: Database failure while loading the monster catalog }

  /monsters/{monsterId}/image:
    get:
      parameters:
        - name: monsterId
          in: path
          required: true
          schema: { type: string }
      summary: Return JPEG art for a specific monster
      responses:
        "200":
          description: Supplied JPEG art
          content: 
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: Unknown card }
        "500": { description: Catalog artwork is missing }
  /players/{playerId}/collection:
    get:
      parameters:
        - $ref: "#/components/parameters/playerId"
      responses:
        "200": { description: Owned card details with active team and progress }
        "500": { description: Database failure while loading a player's collection }

  /players/{playerId}/team:
    put:
      parameters:
        - $ref: "#/components/parameters/playerId"
      requestBody:
        required: true
        content:
          application/json:
            example:
              monsterIds:
                - string
                - string
                - string
            schema:
              type: object
              required: [monsterIds]
              properties:
                monsterIds:
                  type: array
                  minItems: 3
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200": { description: Team saved }
        "400": { description: Invalid team size or duplicate or unknown card }
        "500": { description: Database failure while updating a player's team }

  /internal/players/{playerId}/collection/initialize:
    post:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Assign three distinct random 6/9-CFU cards and create the initial team
      responses:
        "201": { description: Starter collection created }
        "200": { description: Existing collection returned without reassignment }
        "500": { description: Catalog does not contain enough eligible cards or a database failure while initializing a player's collection }

  /internal/players/{playerId}/team:
    get:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Return the validated team and owned card IDs to Game Manager
      responses:
        "200": { description: Validated team }
        "400": { description: Team is missing or malformed or contains unknown cards or includes cards not owned by the player }
        "500": { description: Database failure while loading a player's team }

  /internal/players/{playerId}/collection/monsters:
    post:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Add a captured catalog card (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monsterId]
              properties:
                monsterId: { type: string }
      responses:
        "200": { description: Card belongs to player's collection }
        "400": { description: Player has no collection or the card is unknown }
        "500": { description: Database failure while adding a monster to a player's collection }

  /internal/players/{playerId}/collection:
    delete:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Delete collection and team
      responses:
        "204": { description: Player collection removed }
        "500": { description: Database failure while deleting a player's collection }

  /health:
    get:
      responses:
        "200": { description: Collector service health }
components:
  parameters:
    playerId:
      name: playerId
      in: path
      required: true
      schema: { type: string }
