openapi: 3.1.0
info:
  title: Game Manager API
  version: 1.0.0
  description: Battle lifecycle and resolution. Client requests are routed only through the API Gateway.
servers:
  - url: https://localhost:5000
security:
  - bearerAuth: []
paths:
  /battles:
    post:
      summary: Start or resume an encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        "201": { description: New battle with a CFU-weighted unowned boss and coin-flip initiative }
        "200": { description: Existing battle resumed }
        "409": { description: Invalid team or graduation complete }
  /battles/{battleId}/actions:
    post:
      parameters:
        - $ref: "#/components/parameters/battleId"
      summary: Attack with one living team card; resolve the boss reply and terminal state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType, moveId]
              properties:
                actionType: { const: attack }
                moveId: { type: string }
      responses:
        "200": { description: Current battle state; on completion, reward and history are persisted }
        "400": { description: Invalid action or card }
        "409": { description: Not the player's turn }
        "502": { description: Reward or history persistence is pending; retry safely }
  /battles/{battleId}:
    post:
      parameters:
        - $ref: "#/components/parameters/battleId"
      summary: Withdraw from an active battle and record the loss
      responses:
        "200": { description: Battle abandoned and team restored }
        "404": { description: Battle missing or expired }
  /internal/players/{playerId}/battles:
    delete:
      security:
        - internalToken: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      summary: Clear temporary battles during account deletion
      responses:
        "204": { description: Player battle state removed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    battleId:
      name: battleId
      in: path
      required: true
      schema: { type: string }
