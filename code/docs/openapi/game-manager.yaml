openapi: 3.1.0
info:
  title: Game Manager API
  version: 1.0.0
  description: Battle lifecycle and resolution. Client requests are routed through the API Gateway.
servers:
  - url: http://localhost:5000
paths:
  /battles:
    post:
      summary: Start or resume an encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        "201": { description: New battle with a CFU-weighted unowned boss and coin-flip initiative }
        "200": { description: Existing battle resumed }
        "409": { description: Invalid team or graduation complete }
  /battles/{battleId}/actions:
    post:
      parameters:
        - $ref: "#/components/parameters/battleId"
      summary: Perform an action in the encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType, playerId]
              properties:
                actionType: { enum: [attack, abandon] }
                moveId: { type: string, description: Required when actionType is attack }
                playerId: { type: string }
      responses:
        "200": { description: Updated battle state; reward and history are persisted when completed or abandoned }
        "400": { description: Invalid action or card }
        "409": { description: Not the player's turn }
        "502": { description: Reward or history persistence is pending; retry safely }
  /internal/players/{playerId}/battles:
    delete:
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      summary: Clear temporary battles during account deletion
      responses:
        "204": { description: Player battle state removed }
components:
  parameters:
    battleId:
      name: battleId
      in: path
      required: true
      schema: { type: string }
