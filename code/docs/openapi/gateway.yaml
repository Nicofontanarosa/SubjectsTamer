openapi: 3.1.0
info:
  title: Monster Tamer Public API
  version: 1.0.0
  description: Unauthenticated local HTTP API. The frontend uses the API Gateway only; login verifies credentials but does not create an authenticated server session.
servers:
  - url: http://localhost:5000
paths:
  /:
    get:
      summary: Identify the API service and health endpoint
      responses:
        "200": { description: API Gateway service information }
  /health:
    get:
      responses:
        "200": { description: Gateway health }
  /players:
    post:
      summary: Create a tamer and assign three starter cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                nickname: { type: string, minLength: 1, maxLength: 32 }
                avatar: { type: string }
                bio: { type: string, maxLength: 500 }
      responses:
        "201": { description: Created player profile }
        "400": { description: Invalid account details }
        "409": { description: Email or nickname already used }
        "502": { description: Starter collection could not be initialized }
  /auth/login:
    post:
      summary: Verify credentials and return a player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Player profile }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      summary: Acknowledge client-side logout; no server session is invalidated
      responses:
        "204": { description: No content }
  /players/{playerId}:
    parameters:
      - $ref: "#/components/parameters/playerId"
    get:
      summary: Read a player profile
      responses:
        "200": { description: Player profile }
        "404": { description: Player not found }
    put:
      summary: Update nickname, avatar, and biography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, avatar, bio]
              properties:
                nickname: { type: string, maxLength: 32 }
                avatar: { type: string, maxLength: 40 }
                bio: { type: string, maxLength: 500 }
      responses:
        "200": { description: Updated profile }
        "400": { description: Invalid profile }
        "404": { description: Player not found }
        "409": { description: Nickname already used }
        "500": { description: Profile could not be saved }
    delete:
      summary: Delete account and coordinate removal of collection and history
      responses:
        "404": { description: Player not found }
        "204": { description: Account and associated data deleted }
        "502": { description: Distributed cleanup is incomplete; retry }
  /tutorial:
    get:
      summary: Read the game rules
      responses:
        "200": { description: Tutorial guide }
        "500": { description: Tutorial file is unavailable }
  /monsters:
    get:
      parameters:
        - name: playerId
          in: query
          schema: { type: string }
      summary: Browse every image-backed catalog card and optional ownership state
      responses:
        "200": { description: Catalog cards and ownership flags }
  /monsters/{monsterId}/image:
    get:
      parameters:
        - $ref: "#/components/parameters/monsterId"
      summary: Retrieve a card's original supplied artwork
      responses:
        "200":
          description: JPEG card art
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: Unknown card }
        "500": { description: Card artwork is unavailable }
  /players/{playerId}/collection:
    get:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Read owned cards and the active team
      responses:
        "200": { description: Collection, team IDs, and progress }
  /players/{playerId}/team:
    put:
      parameters:
        - $ref: "#/components/parameters/playerId"
      summary: Replace the active team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monsterIds]
              properties:
                monsterIds:
                  type: array
                  minItems: 3
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200": { description: Saved active team }
        "400": { description: Invalid team, unknown card, or card not owned }
  /battles:
    post:
      summary: Begin or resume a player's encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        "201": { description: New battle, boss, team, and coin-toss initiative }
        "200": { description: Existing active battle resumed }
        "400": { description: Player ID is required }
        "409": { description: Invalid team or all cards collected }
        "502": { description: Collector is unavailable or returned an invalid response }
  /battles/{battleId}/actions:
    post:
      parameters:
        - $ref: "#/components/parameters/battleId"
      summary: Perform an attack or abandon an encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [actionType, moveId, playerId]
                  properties:
                    actionType: { const: attack }
                    moveId: { type: string }
                    playerId: { type: string }
                - type: object
                  required: [actionType, playerId]
                  properties:
                    actionType: { const: abandon }
                    playerId: { type: string }
      responses:
        "200": { description: Updated battle state and final result, if concluded or abandoned }
        "400": { description: Invalid action or unavailable attacker }
        "403": { description: Battle belongs to another player }
        "404": { description: Battle is missing or expired }
        "409": { description: Wrong turn }
        "502": { description: Reward or history persistence is pending; retry safely }
  /players/{playerId}/encounters:
    get:
      parameters:
        - $ref: "#/components/parameters/playerId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      summary: Read encounter history
      responses:
        "200": { description: Paginated encounter records }
        "400": { description: Invalid pagination }
components:
  parameters:
    playerId:
      name: playerId
      in: path
      required: true
      schema: { type: string }
    monsterId:
      name: monsterId
      in: path
      required: true
      schema: { type: string }
    battleId:
      name: battleId
      in: path
      required: true
      schema: { type: string }
